[package]
name = "matlua"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Dense numeric arrays and linear algebra for Lua 5.4 (Rust core, Arrow + faer)"
repository = "https://github.com/andy-emerson/MatLua"
readme = "README.md"
keywords = ["lua", "array", "linear-algebra", "arrow", "faer"]
categories = ["science", "mathematics", "api-bindings"]
rust-version = "1.85"
exclude = ["vendor/lua/doc/**"]

[features]
default = []
# Hand-rolled Lua 5.4 face + vendored PUC interpreter for tests/embed convenience.
lua = []

[dependencies]
arrow-array = { version = "59.1.0", default-features = false }
arrow-buffer = { version = "59.1.0", default-features = false }
arrow-schema = { version = "59.1.0", default-features = false }
faer = "0.24.4"
thiserror = "2.0.19"

[build-dependencies]
cc = "1.2"

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Integration correctness (public API)
[[test]]
name = "correctness_public_api"
path = "tests/correctness/public_api.rs"

[[test]]
name = "correctness_lua_face"
path = "tests/correctness/lua_face.rs"
required-features = ["lua"]

# Fair three-face microbench (harness = false binary)
[[test]]
name = "fair_all"
path = "tests/bench/fair_all.rs"
harness = false
required-features = ["lua"]

[[test]]
name = "compose_chain"
path = "tests/bench/compose_chain.rs"
harness = false
required-features = ["lua"]

[[test]]
name = "path_length"
path = "tests/bench/path_length.rs"
harness = false
